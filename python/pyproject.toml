[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "told"
version = "0.1.0"
description = "Python interface to TOLD, the Typo Lenght Data binary serialization format"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Claudio Russo (gattoarancione)" }]

[tool.setuptools]
packages = ["told"]

# The shared library is expected inside the package as told/_lib/. `zig build wheel`
# copies it there; a checkout is found via ../zig-out/lib, and TOLD_LIBRARY overrides both.
[tool.setuptools.package-data]
told = ["_lib/*"]
